# Weekly grouped update PRs. The `build` prefix gives Commitizen-compliant titles (`build: bump ...`).
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    # Compiled gh-aw workflows are regenerated by `gh aw compile`; upgrade gh-aw instead.
    exclude-paths:
      - .github/workflows/*.lock.yml
    schedule:
      interval: weekly
    commit-message:
      prefix: build
    groups:
      github-actions:
        patterns: ["*"]

  - package-ecosystem: pip
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: build
    groups:
      python:
        patterns: ["*"]
