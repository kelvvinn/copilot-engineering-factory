# Install once: uv pip install -r requirements.txt && pre-commit install
# See https://pre-commit.com for more information

default_install_hook_types:
    - pre-commit
    - commit-msg
    - pre-push

# File checks run on commit (and in the `lint` workflow). The commitizen hooks set their own stages.
default_stages: [pre-commit, manual]

# Compiled gh-aw workflows are generated by `gh aw compile`.
exclude: ^\.github/workflows/.*\.lock\.yml$

repos:
    - repo: https://github.com/pre-commit/pre-commit-hooks
      rev: v6.0.0
      hooks:
          - id: check-yaml
          - id: check-toml
          - id: check-json
          - id: end-of-file-fixer
          - id: trailing-whitespace
            args: [--markdown-linebreak-ext=md]
          - id: mixed-line-ending
            args: [--fix=lf]
          - id: check-merge-conflict
          - id: check-added-large-files
          - id: check-executables-have-shebangs
          - id: check-shebang-scripts-are-executable
          - id: detect-private-key

    - repo: https://github.com/shellcheck-py/shellcheck-py
      rev: v0.11.0.1
      hooks:
          - id: shellcheck

    - repo: https://github.com/Mateusz-Grzelinski/actionlint-py
      rev: v1.7.12.25
      hooks:
          - id: actionlint

    - repo: local
      hooks:
          # Validate the commit message on commit.
          - id: commitizen_on_commit
            stages: [commit-msg]
            name: commitizen_on_commit
            entry: python -m commitizen
            args: [check, --commit-msg-file]
            language: system

          # Validate all commits between origin/main and HEAD on push.
          - id: commitizen_on_push
            stages: [pre-push]
            name: commitizen_on_push
            entry: python -m commitizen
            args: [check, --rev-range, origin/main..HEAD, --]
            pass_filenames: false
            language: system
